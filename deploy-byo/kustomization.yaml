# Our own cluster (Radar starter's bring-your-own path). Same app as deploy/, plus:
# - an in-cluster Cloudflare tunnel for public HTTPS instead of the hackathon gateway HTTPRoute
# - no PUBLIC_BASE_URL: a quick-tunnel host changes on restart, so pages use their own origin
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-pulse
resources:
  - ../deploy
  - tunnel.yaml
patches:
  - target: {kind: HTTPRoute, name: app}
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: app
  - target: {kind: Deployment, name: app}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: app
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: PUBLIC_BASE_URL
                    $patch: delete
