# Laptop demo only: public HTTPS for phones without the hackathon gateway. Talks to Service app directly,
# so app restarts don't drop the public URL. The URL is printed in this pod's logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  labels: {app: tunnel}
spec:
  replicas: 1
  selector: {matchLabels: {app: tunnel}}
  template:
    metadata: {labels: {app: tunnel}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://app.team-pulse.svc.cluster.local:80"]
          ports:
            - name: metrics
              containerPort: 2000
          # cloudflared reports /ready once it holds a tunnel connection (Radar check: missing probes).
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
