# Create this once, and Argo CD deploys deploy/ on every push to main.
# Ask your agent to apply it through Radar's MCP server (apply_resource), or
# apply it from Radar Cloud. Your repo must be public so Argo CD can read it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-pulse
spec:
  project: team-pulse
  source:
    repoURL: https://github.com/owenbodily-osbmach1/HACKATHONproject-T-O.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-pulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
