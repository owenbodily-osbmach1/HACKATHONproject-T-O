apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Must stay 1: rooms, sockets and vote windows live in memory (CONTRACT.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # Pulse never calls the Kubernetes API, so it gets no service account token (Radar check).
      automountServiceAccountToken: false
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "pulse"
            - name: PUBLIC_BASE_URL
              value: "https://pulse.cnh.radarhq.io"
          # Keys live only in this Secret (created in Radar Cloud or by kubectl), never in git.
          envFrom:
            - secretRef:
                name: app-credentials
                optional: true
          # Right-sized from Radar + a load test (Nov 9): 500 phones on one pod peaked at ~52m CPU / 41 MiB
          # (Radar showed 11m / 35 MiB idle vs 100m / 128 MiB requested). Memory limit keeps room for the
          # 128 MB slide-frame cache. Memory request covers that cache (~41 MiB + 128 MB) so the
          # pod is not first in line for eviction under node memory pressure (Gitar).
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Radar AI investigation (12:12 PM): the only Warning event was a readiness failure in the
          # first second, before the server logged it was listening. The startup probe gives boot a grace window.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
