<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pulse · Join the room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23FFD400'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="attendee joinpage">
  <main class="join">
    <header class="join-head">
      <span class="wordmark">PULSE</span>
      <p class="join-room"><span class="room-badge" id="roomBadge">Room —</span> <span id="talkTitle"></span></p>
      <h1>Join the room</h1>
      <p class="join-sub">Live captions, listen-in audio and a direct line to the AV crew.</p>
    </header>

    <form id="joinForm" novalidate>
      <div class="field-pair">
        <div class="field">
          <label for="first">First name</label>
          <input id="first" name="first" autocomplete="given-name" maxlength="60" required aria-describedby="firstErr">
          <p class="field-err" id="firstErr" role="alert"></p>
        </div>
        <div class="field">
          <label for="last">Last name</label>
          <input id="last" name="last" autocomplete="family-name" maxlength="60" required aria-describedby="lastErr">
          <p class="field-err" id="lastErr" role="alert"></p>
        </div>
      </div>
      <div class="field">
        <label for="company">Company / occupation</label>
        <input id="company" name="company" autocomplete="organization" maxlength="100" required aria-describedby="companyErr">
        <p class="field-err" id="companyErr" role="alert"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="254" required aria-describedby="emailErr">
        <p class="field-err" id="emailErr" role="alert"></p>
      </div>

      <p class="join-why">Only the event team sees this, to follow up with you about the session. Other attendees never see it.</p>
      <button type="submit" class="join-btn" id="joinBtn">Join the room →</button>
      <p class="join-msg" id="joinMsg" role="status"></p>
    </form>

    <p class="footnote">No app · this page can't use your mic · you only sign in once</p>
  </main>
  <script type="module" src="/join.js"></script>
</body>
</html>
