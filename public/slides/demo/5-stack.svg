      <text x="132" y="504" font-size="22" fill="#a7b0bc">One pod, one replica. Deployed and watched</text>
      <text x="132" y="536" font-size="22" fill="#a7b0bc">from the Radar console.</text>
    </g>

    <g>
      <rect x="820" y="370" width="680" height="206" rx="20" fill="#151920" stroke="#2a313c" stroke-width="2"/>
