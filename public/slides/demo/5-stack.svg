    <text x="100" y="222" font-size="22" font-weight="800" letter-spacing="5" fill="#4cc2ff">TECH STACK</text>
    <text x="100" y="316" font-size="72" font-weight="800" letter-spacing="-1" fill="#f4f6f8">Small stack. Live path first.</text>

