<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="slideTitle">
  <title id="slideTitle">Thank you</title>
  <defs>
    <radialGradient id="glow" cx="18%" cy="80%" r="70%">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#0b0d10"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <circle cx="108" cy="88" r="9" fill="#4cc2ff"/>
    <text x="132" y="96" font-size="22" font-weight="800" letter-spacing="7" fill="#f4f6f8">PULSE</text>

    <text x="100" y="402" font-size="140" font-weight="800" letter-spacing="-4" fill="#f4f6f8">Thank you.</text>
    <text x="100" y="500" font-size="34" fill="#a7b0bc">Questions? Scan the title slide to try Pulse live.</text>

    <g fill="#4cc2ff" opacity="0.85">
      <rect x="100" y="586" width="14" height="58" rx="7"/>
      <rect x="132" y="610" width="14" height="34" rx="7" opacity="0.7"/>
      <rect x="164" y="566" width="14" height="78" rx="7"/>
      <rect x="196" y="628" width="14" height="16" rx="7" opacity="0.5"/>
      <rect x="228" y="594" width="14" height="50" rx="7" opacity="0.8"/>
    </g>

    <rect x="100" y="812" width="1400" height="2" fill="#2a313c"/>
    <text x="100" y="858" font-size="24" font-weight="700" fill="#4cc2ff">Pulse — every seat hears the talk.</text>
    <text x="1500" y="858" text-anchor="end" font-size="20" fill="#6f7a88">06 / 06</text>
  </g>
</svg>
